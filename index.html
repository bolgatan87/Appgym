<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceff4">
<title>Fuerza en 5 días</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff4;--ink:#0e1b2e;--mu:#5d6b82;--ln:#d3dae5;--bl:#2347ff;--hi:#ff3d6e;--ok:#0f9d7a;--fig:#eef2f7}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,sans-serif;padding-bottom:90px}
h1,h2,h3{font-stretch:75%;font-weight:800;letter-spacing:-.01em;line-height:1.05}
h1{font-size:36px}h2{font-size:28px}h3{font-size:20px;margin:22px 0 8px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.w{max-width:620px;margin:0 auto;padding:0 18px}
header{padding:calc(20px + env(safe-area-inset-top,0px)) 0 4px}
.sub,small{color:var(--mu);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.tabs button{padding:11px 0;border-radius:10px;background:#fff;font-weight:700;border:1px solid var(--ln)}
.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 10px}
.dt span{color:var(--mu);font-size:13px;text-align:right}
.ex{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--ln)}
.ex i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ln)}
.ex i.ck{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 4px var(--bg)}
.ex div{flex:1;min-width:0}.ex b{display:block;font-weight:700}
.ex em{font-style:normal;font-weight:800;font-stretch:75%;color:var(--bl);font-size:18px;white-space:nowrap}
#sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;display:none;padding-bottom:40px}
#sheet.on{display:block;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sb{display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px}
.sb button{padding:9px 14px;border-radius:10px;background:#fff;border:1px solid var(--ln);font-weight:600}
.fc{background:var(--fig);border-radius:20px;margin:14px 0 10px;padding:6px 10px 12px;position:relative}
.fc svg{display:block;width:100%;height:auto}
.ctl{display:flex;gap:12px;align-items:center;color:#5d6b82;font-size:13px}
.ctl button{color:var(--ink);padding:6px 12px;border-radius:8px;border:1px solid #b3c0cf}
.ctl input{flex:1;accent-color:var(--hi)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips span{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--ln);padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px}
.chips span{cursor:pointer}.chips span.s:before{background:#ffb02e!important}.chips span.on{outline:2px solid var(--ink)}
.chips span:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--hi)}
.mp{padding:6px;background:#fff}.pk{animation:pk 1.1s ease-in-out infinite alternate}@keyframes pk{to{opacity:.5}}
.cd{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 16px;margin:12px 0}.cd h3{margin:0 0 8px;font-size:19px}.cd ul{margin:6px 0 0 18px}.cd li{margin:0 0 6px}.cd svg{display:block;margin:0 auto;width:100%;max-width:260px}.bad{border-color:#f0b4bf;background:#fff5f7}.ang{font-size:13px;color:var(--mu);margin:2px 2px 10px}
.vt{display:flex;gap:6px;margin:6px 0 8px}.vt button{flex:1;padding:9px;border-radius:10px;background:#fff;border:1px solid var(--ln);font-weight:700;font-size:14px}.vt .on{background:var(--ink);color:#fff;border-color:var(--ink)}.pho{position:relative;background:#fff;border-radius:12px;overflow:hidden}.pho img{display:block;width:100%;height:auto}.pho img+img{position:absolute;left:0;top:0;opacity:0}#phc{margin:8px 2px 4px;font-size:12px}
.tip{background:#fff;border-left:4px solid var(--bl);padding:12px 14px;border-radius:4px 12px 12px 4px}
.r,.rh{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.rh{color:var(--mu);font-size:13px}.r span{font-weight:800;font-size:20px;font-stretch:75%;text-align:center}
.r input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:#fff;font-size:17px}
textarea{margin:12px 0 6px;font-size:15px;resize:vertical;min-height:70px}
.add{color:var(--bl);font-weight:700;padding:8px 0}
.info{color:var(--mu);font-size:14px;margin:6px 0 16px;white-space:pre-line}
.btn{width:100%;padding:15px;border-radius:12px;background:var(--bl);color:#fff;font-weight:700;font-size:17px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.st div{background:#fff;border-radius:12px;padding:12px;font-size:12px;color:var(--mu);border:1px solid var(--ln)}
.st b{display:block;font-size:26px;font-stretch:75%;font-weight:800;color:var(--ink);line-height:1.1}
details{border-bottom:1px solid var(--ln);padding:12px 0}
summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}summary b{display:block}
details p{font-size:14px;margin-top:8px;color:var(--mu)}details p b{color:var(--ink);display:inline}
.empty{margin:30px 0;color:var(--mu)}
.bk{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.bk button,.bk label{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--ln);font-weight:600;font-size:14px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;padding:16px 0;font-weight:700;color:var(--mu)}nav .on{color:var(--bl);box-shadow:inset 0 3px var(--bl)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#toast.on{opacity:1}
</style></head><body>
<div class="w" id="home"></div><div class="w" id="prog" hidden></div><div id="sheet"></div>
<nav><button id="n1" class="on">Rutina</button><button id="n2">Progreso</button></nav><div id="toast"></div>
