<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuerza en 5 días</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --card: #141418;
    --card-2: #1e1e24;
    --border: #2c2c35;
    --text: #f4f4f6;
    --muted: #8b8b99;
    --accent: #f97316;
    --accent-glow: rgba(249, 115, 22, 0.25);
    --green: #22c55e;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Archivo', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); padding-bottom: 90px; max-width: 620px; margin: 0 auto; }
  header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .view { display: none; padding: 0 20px; }
  .view.active { display: block; }
  
  /* Navegación por días */
  .days-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 20px; scrollbar-width: none; }
  .days-scroll::-webkit-scrollbar { display: none; }
  .day-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
  .day-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

  /* Tarjetas de ejercicios */
  .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; display: flex; gap: 14px; align-items: center; cursor: pointer; transition: transform 0.1s; }
  .ex-card:active { transform: scale(0.98); }
  .ex-thumb { width: 64px; height: 64px; border-radius: 10px; background: var(--card-2); object-fit: cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .ex-info { flex-grow: 1; }
  .ex-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .ex-meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; }
  .ex-check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .ex-card.done .ex-check { background: var(--green); border-color: var(--green); color: #fff; }

  /* Barra de navegación inferior */
  nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 620px; margin: 0 auto; background: rgba(20, 20, 24, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
  .nav-item { background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

  /* Modal de Detalle */
  .sheet { position: fixed; bottom: -100%; left: 0; right: 0; max-width: 620px; margin: 0 auto; background: var(--card); border-top: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 24px; z-index: 200; transition: bottom 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); max-height: 85vh; overflow-y: auto; }
  .sheet.open { bottom: 0; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 150; display: none; }
  .overlay.open { display: block; }
  
  .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .sheet-title { font-size: 20px; font-weight: 800; }
  .close-btn { background: var(--card-2); border: none; color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }

  .set-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; background: var(--card-2); padding: 10px 14px; border-radius: 12px; }
  .set-num { font-weight: 700; width: 30px; color: var(--accent); }
  .set-input { background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 8px; width: 70px; text-align: center; font-weight: 600; }
  
  .btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <h1>Fuerza en <span>5 Días</span></h1>
</header>

<!-- VISTA RUTINA -->
<div id="view-rutina" class="view active">
  <div class="days-scroll" id="days-container"></div>
  <div id="exercises-container"></div>
</div>

<!-- VISTA PROGRESO -->
<div id="view-progreso" class="view">
  <h2 style="font-size:20px; margin-bottom:14px;">Tu Progreso</h2>
  <div style="background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center;">
    <p style="color:var(--muted); font-size:14px;">Entrenamientos completados esta semana</p>
    <p id="stats-count" style="font-size:36px; font-weight:800; color:var(--accent); margin-top:10px;">0 / 5</p>
  </div>
</div>

<!-- VISTA EJERCICIOS (LIBRERÍA) -->
<div id="view-ejercicios" class="view">
  <h2 style="font-size:20px; margin-bottom:14px;">Biblioteca de Ejercicios</h2>
  <div id="library-container"></div>
</div>

<!-- BARRA DE NAVEGACIÓN -->
<nav>
  <button class="nav-item active" onclick="switchView('rutina')">
    <svg viewBox="0 0 24 24"><path d="M20.5 3h-17C2.67 3 2 3.67 2 4.5v15C2 20.33 2.67 21 3.5 21h17c.83 0 1.5-.67 1.5-1.5v-15c0-.83-.67-1.5-1.5-1.5zM19 19H5V5h14v14zM11 7h2v10h-2z"/></svg>
    Rutina
  </button>
  <button class="nav-item" onclick="switchView('progreso')">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
    Progreso
  </button>
  <button class="nav-item" onclick="switchView('ejercicios')">
    <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
    Ejercicios
  </button>
</nav>

<!-- HOJA DE DETALLE / EDICIÓN DE EJERCICIO -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-header">
    <div>
      <div id="sheet-category" style="font-size:12px; color:var(--accent); font-weight:700; text-transform:uppercase; margin-bottom:4px;"></div>
      <div class="sheet-title" id="sheet-title">Nombre del Ejercicio</div>
    </div>
    <button class="close-btn" onclick="closeSheet()">✕</button>
  </div>
  <div id="sheet-body">
    <!-- Contenido dinámico de series -->
  </div>
  <button class="btn-primary" onclick="saveExerciseProgress()">Guardar Serie</button>
</div>

<script>
  // Base de datos de la rutina de 5 días
  const RUTINA = [
    {
      dia: "Día 1: Pecho y Tríceps",
      ejercicios: [
        { id: "d1_1", nombre: "Press de Banca con Barra", series: 4, reps: "8-10", cat: "Pecho" },
        { id: "d1_2", nombre: "Press Inclinado con Mancuernas", series: 3, reps: "10-12", cat: "Pecho" },
        { id: "d1_3", nombre: "Aperturas en Polea", series: 3, reps: "12-15", cat: "Pecho" },
        { id: "d1_4", nombre: "Extensiones de Tríceps en Polea", series: 3, reps: "10-12", cat: "Tríceps" }
      ]
    },
    {
      dia: "Día 2: Espalda y Bíceps",
      ejercicios: [
        { id: "d2_1", nombre: "Dominadas o Jalón al Pecho", series: 4, reps: "8-10", cat: "Espalda" },
        { id: "d2_2", nombre: "Remo con Barra", series: 3, reps: "8-10", cat: "Espalda" },
        { id: "d2_3", nombre: "Remo Unilateral con Mancuerna", series: 3, reps: "10-12", cat: "Espalda" },
        { id: "d2_4", nombre: "Curl de Bíceps con Mancuernas", series: 3, reps: "10-12", cat: "Bíceps" }
      ]
    },
    {
      dia: "Día 3: Pierna (Enfoque Cuádriceps)",
      ejercicios: [
        { id: "d3_1", nombre: "Sentadilla Libre", series: 4, reps: "6-8", cat: "Piernas" },
        { id: "d3_2", nombre: "Prensa de Piernas", series: 3, reps: "10-12", cat: "Piernas" },
        { id: "d3_3", nombre: "Extensiones de Cuádriceps", series: 3, reps: "12-15", cat: "Piernas" },
        { id: "d3_4", nombre: "Elevación de Talones (Pantorrillas)", series: 4, reps: "15-20", cat: "Piernas" }
      ]
    },
    {
      dia: "Día 4: Hombros y Trapecio",
      ejercicios: [
        { id: "d4_1", nombre: "Press Militar con Barra", series: 4, reps: "8-10", cat: "Hombros" },
        { id: "d4_2", nombre: "Elevaciones Laterales con Mancuernas", series: 4, reps: "12-15", cat: "Hombros" },
        { id: "d4_3", nombre: "Pájaros (Posteriores)", series: 3, reps: "12-15", cat: "Hombros" },
        { id: "d4_4", nombre: "Encogimientos de Hombros", series: 3, reps: "10-12", cat: "Trapecio" }
      ]
    },
    {
      dia: "Día 5: Pierna (Enfoque Cadena Posterior)",
      ejercicios: [
        { id: "d5_1", nombre: "Peso Muerto Rumano", series: 4, reps: "8-10", cat: "Piernas" },
        { id: "d5_2", nombre: "Curl Femoral Tumbado", series: 3, reps: "10-12", cat: "Piernas" },
        { id: "d5_3", nombre: "Hip Thrust", series: 4, reps: "10-12", cat: "Glúteos" },
        { id: "d5_4", nombre: "Plancha Abdominal", series: 3, reps: "45 seg", cat: "Core" }
      ]
    }
  ];

  let currentDayIndex = 0;
  let activeExercise = null;
  let progressData = JSON.parse(localStorage.getItem('fuerza_progress') || '{}');

  // Inicializar interfaz
  function init() {
    renderDays();
    renderExercises();
    renderLibrary();
    updateStats();
  }

  function renderDays() {
    const container = document.getElementById('days-container');
    container.innerHTML = RUTINA.map((d, i) => `
      <button class="day-btn ${i === currentDayIndex ? 'active' : ''}" onclick="selectDay(${i})">${d.dia}</button>
    `).join('');
  }

  function selectDay(index) {
    currentDayIndex = index;
    renderDays();
    renderExercises();
  }

  function renderExercises() {
    const container = document.getElementById('exercises-container');
    const day = RUTINA[currentDayIndex];
    
    container.innerHTML = day.ejercicios.map(ex => {
      const isDone = progressData[ex.id]?.done;
      return `
        <div class="ex-card ${isDone ? 'done' : ''}" onclick="openExercise('${ex.id}')">
          <div class="ex-thumb">💪</div>
          <div class="ex-info">
            <div class="ex-name">${ex.nombre}</div>
            <div class="ex-meta">
              <span>${ex.series} series</span>
              <span>•</span>
              <span>${ex.reps} reps</span>
            </div>
          </div>
          <div class="ex-check">✓</div>
        </div>
      `;
    }).join('');
  }

  function openExercise(id) {
    const day = RUTINA[currentDayIndex];
    activeExercise = day.ejercicios.find(e => e.id === id);
    
    document.getElementById('sheet-category').innerText = activeExercise.cat;
    document.getElementById('sheet-title').innerText = activeExercise.nombre;
    
    const body = document.getElementById('sheet-body');
    let html = '';
    for(let i = 1; i <= activeExercise.series; i++) {
      html += `
        <div class="set-row">
          <span class="set-num">#${i}</span>
          <span style="font-size:13px; color:var(--muted); flex-grow:1;">Peso / Reps</span>
          <input type="number" class="set-input" placeholder="kg" id="weight_${i}">
          <input type="number" class="set-input" placeholder="reps" id="reps_${i}">
        </div>
      `;
    }
    body.innerHTML = html;

    document.getElementById('sheet').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  }

  function closeSheet() {
    document.getElementById('sheet').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  function saveExerciseProgress() {
    if(!activeExercise) return;
    progressData[activeExercise.id] = { done: true };
    localStorage.setItem('fuerza_progress', JSON.stringify(progressData));
    closeSheet();
    renderExercises();
    updateStats();
  }

  function renderLibrary() {
    const container = document.getElementById('library-container');
    const allExs = RUTINA.flatMap(d => d.ejercicios);
    // Eliminar duplicados si los hubiera
    const unique = Array.from(new Set(allExs.map(e => e.nombre)))
      .map(nombre => allExs.find(e => e.nombre === nombre));

    container.innerHTML = unique.map(ex => `
      <div class="ex-card">
        <div class="ex-thumb">🏋️</div>
        <div class="ex-info">
          <div class="ex-name">${ex.nombre}</div>
          <div class="ex-meta">
            <span>Categoría: ${ex.cat}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function updateStats() {
    const allIds = RUTINA.flatMap(d => d.ejercicios.map(e => e.id));
    const completed = allIds.filter(id => progressData[id]?.done).length;
    // Cálculo estimado de días completados basados en bloques
    const daysDone = Math.min(5, Math.floor(completed / 3));
    document.getElementById('stats-count').innerText = `${daysDone} / 5`;
  }

  function switchView(viewName) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    document.getElementById(`view-${viewName}`).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  window.onload = init;
</script>
</body>
</html>
